[package]
name = "quickmark-core"
version = "1.1.0"
edition = "2021"
# comrak needs 1.85; `u32::is_multiple_of` in md036 needs 1.87.
rust-version = "1.87"
description = "Lightning-fast Markdown/CommonMark linter core library with comrak based parsing"
license = "MIT"
authors = ["Evgeny Kropotin"]
repository = "https://github.com/ekropotin/quickmark"
homepage = "https://github.com/ekropotin/quickmark"
keywords = ["markdown", "linter", "lint", "commonmark"]
categories = ["text-processing", "development-tools"]

[dependencies]
anyhow = "1.0.104"
# default-features is load-bearing: comrak's defaults are ["cli", "syntect-onig", "bon"], and
# syntect-onig pulls oniguruma — a C library — plus clap. Without this we would trade tree-sitter's
# C grammar for a different C dependency and break the Windows release matrix.
comrak = { version = "0.55", default-features = false }
linkify = "0.11"
once_cell = "1.21"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.6"
unicode-width = "0.2"

[features]
testing = []

[dev-dependencies]
tempfile = "3.27"
